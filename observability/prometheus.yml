global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: krakend
    metrics_path: /metrics
    static_configs:
      - targets: ["krakend:9091"]
        labels:
          application: parallel-fab-lua-transform-poc
  - job_name: mock-api
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-api:8080"]
        labels:
          application: parallel-fab-lua-transform-poc
